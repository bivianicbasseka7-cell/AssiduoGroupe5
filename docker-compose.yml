services:
  app:
    build: .
    container_name: gestion_absences_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DATABASE_URL: "mysql://symfony:symfony@db:3306/symfony?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: gestion_absences_web
    ports:
      - "8090:80"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: gestion_absences_db
    environment:
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  db_data: